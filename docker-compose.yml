version: '3'

services:
  node-server:
    build:
      context: ./server
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      - redis-server
    restart: always

  redis-server:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  client-server:
    build:
      context: ./client
    depends_on:
      - node-server
    restart: always

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client-server
      - node-server
    ports:
      - "4000:80"
    restart: always
