version: '3'
services:
  node-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app
    ports:
      - '8081:8081'
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis-server
      - REDIS_PORT=6379
    depends_on:
      - redis-server
      - zookeeper-server
    restart: always

  client-server:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true   # Fixes live reload on Windows


  redis-server:
    image: redis
    ports:
      - '6379:6379'
    restart: always

  zookeeper-server:
    image: zookeeper
    ports:
      - '2181:2181'
    restart: always

  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - node-server
    ports:
      - '4000:80'
